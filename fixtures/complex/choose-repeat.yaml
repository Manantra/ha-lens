alias: Evening controller
triggers:
  - trigger: state
    entity_id: binary_sensor.motion_hall
    to: "on"
  - trigger: time
    at: "22:30:00"
conditions:
  - condition: state
    entity_id: input_boolean.automation_enabled
    state: "on"
actions:
  - choose:
      - alias: Guests home
        conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hall
      - alias: Nobody home
        conditions:
          - condition: state
            entity_id: zone.home
            state: "0"
        sequence:
          - action: notify.mobile_app_phone
            data:
              message: Motion while nobody is home
    default:
      - repeat:
          count: 2
          sequence:
            - action: light.toggle
              target:
                entity_id: light.hall
            - delay: "00:00:01"
  - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.motion_hall
        to: "off"
    timeout: "00:05:00"
    continue_on_timeout: false
  - action: light.turn_off
    target:
      entity_id: light.hall
