name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Validate HACS companion
        run: |
          python -m compileall -q custom_components/ha_lens
          python -m json.tool custom_components/ha_lens/manifest.json > /dev/null
          python -m json.tool custom_components/ha_lens/strings.json > /dev/null
          for file in custom_components/ha_lens/translations/*.json; do python -m json.tool "$file" > /dev/null; done
          python -m json.tool custom_components/ha_lens/frontend/i18n.json > /dev/null
          python -m json.tool hacs.json > /dev/null
          node --check custom_components/ha_lens/frontend/ha-lens-panel.js
          python - <<'PY'
          from pathlib import Path
          from struct import unpack
          for name in ("icon.png", "logo.png"):
              path = Path("custom_components/ha_lens/brand") / name
              image = path.read_bytes()
              assert image.startswith(bytes.fromhex("89504e470d0a1a0a")), f"{name} is not PNG"
              width, height = unpack(">II", image[16:24])
              assert width == height and width >= 128, f"{name} dimensions invalid: {width}x{height}"
          assert Path("custom_components/ha_lens/frontend/brand/icon.png").is_file()
          PY
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-lens-sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
