name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Validate HACS companion
        run: |
          python -m compileall -q custom_components/ha_lens
          python -m json.tool custom_components/ha_lens/manifest.json > /dev/null
          python -m json.tool custom_components/ha_lens/strings.json > /dev/null
          python -m json.tool hacs.json > /dev/null
          node --check custom_components/ha_lens/frontend/ha-lens-panel.js
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
