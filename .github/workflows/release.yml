name: Release HACS integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "custom_components/ha_lens/manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/ha_lens/manifest.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate bundled companion frontend
        run: |
          test -f custom_components/ha_lens/frontend/app/index.html
          grep -q "/ha_lens_static/app/assets/" custom_components/ha_lens/frontend/app/index.html

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HA Lens $TAG" \
            --notes "Read-only Home Assistant automation visualizer with local/offline HACS companion frontend, responsive layout, richer template/entity analysis, entity metadata, and export tools." \
            "${PRERELEASE_ARGS[@]}"
