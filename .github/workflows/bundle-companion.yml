name: Bundle HACS companion frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/sync-companion-dist.mjs"
      - ".github/workflows/bundle-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-bundle
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Build local Home Assistant viewer
        run: npm run bundle:companion
        env:
          VITE_BASE_PATH: /ha_lens_static/app/
      - name: Upload bundled frontend
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ha-lens-companion-frontend
          path: custom_components/ha_lens/frontend/app
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Ensure this build still matches main
        id: freshness
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale bundle: main advanced after this build started."
          fi
      - name: Clear previously hashed bundle assets
        if: steps.freshness.outputs.current == 'true'
        run: |
          rm -rf custom_components/ha_lens/frontend/app
          mkdir -p custom_components/ha_lens/frontend/app
      - name: Download verified bundle
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ha-lens-companion-frontend
          path: custom_components/ha_lens/frontend/app
      - name: Commit bundled frontend
        if: steps.freshness.outputs.current == 'true'
        run: |
          if [ -z "$(git status --porcelain -- custom_components/ha_lens/frontend/app)" ]; then
            echo "Bundled frontend is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha_lens/frontend/app
          git commit -m "chore: refresh bundled companion frontend [skip ci]"
          git push
