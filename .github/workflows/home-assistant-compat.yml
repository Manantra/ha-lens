name: Home Assistant compatibility

on:
  push:
    branches: [main]
    paths:
      - "custom_components/ha_lens/**"
      - ".github/workflows/home-assistant-compat.yml"
  pull_request:
    paths:
      - "custom_components/ha_lens/**"
      - ".github/workflows/home-assistant-compat.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-contract:
    name: HA ${{ matrix.home_assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home_assistant:
          - "2026.9.4"
          - "2026.10.0b1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.2"
      - name: Install pinned Home Assistant
        run: python -m pip install --disable-pip-version-check "homeassistant==${{ matrix.home_assistant }}"
      - name: Verify HA Lens import contract
        run: |
          python - <<'PY'
          import importlib
          import pathlib

          module = importlib.import_module("custom_components.ha_lens")
          assert callable(module.async_setup_entry)
          assert callable(module.async_unload_entry)

          source = pathlib.Path("custom_components/ha_lens/__init__.py").read_text()
          forbidden = (
              "DATA_COMPONENT",
              "ha_lens/automations",
              "websocket_api.async_register_command",
          )
          for token in forbidden:
              assert token not in source, f"Private/custom HA API dependency returned: {token}"
          print("HA Lens companion imports against Home Assistant and uses only the expected panel/static contract.")
          PY
