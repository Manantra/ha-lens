name: Home Assistant compatibility

on:
  push:
    branches: [main]
    paths:
      - "custom_components/ha_lens/**"
      - "packages/model/**"
      - "packages/parser/**"
      - "packages/analyzer/**"
      - "packages/paths/**"
      - "packages/graph/**"
      - "tests/ha-2026-compat.test.ts"
      - ".github/workflows/home-assistant-compat.yml"
  pull_request:
    paths:
      - "custom_components/ha_lens/**"
      - "packages/model/**"
      - "packages/parser/**"
      - "packages/analyzer/**"
      - "packages/paths/**"
      - "packages/graph/**"
      - "tests/ha-2026-compat.test.ts"
      - ".github/workflows/home-assistant-compat.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-contract:
    name: HA ${{ matrix.home_assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Previous stable stays in the matrix to catch accidental regressions
          # for users who do not upgrade Home Assistant immediately.
          - home_assistant: "2026.9.4"
            install_source: "homeassistant==2026.9.4"
          # Current Home Assistant stable.
          - home_assistant: "2026.10.1"
            install_source: "homeassistant==2026.10.1"
          # Final 2026.10 beta tag, pinned to the exact upstream commit.
          # Keeping the prerelease contract is useful because several automation
          # editor migrations landed during the beta cycle.
          - home_assistant: "2026.10.0b7"
            install_source: "https://github.com/home-assistant/core/archive/276922cfc37651b125d2c76f6c19f4ac6d4d990f.tar.gz"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.2"
      - name: Install pinned Home Assistant
        run: python -m pip install --disable-pip-version-check "${{ matrix.install_source }}"
      - name: Verify HA Lens import contract
        run: |
          python - <<'PY'
          import importlib
          import inspect
          import pathlib

          module = importlib.import_module("custom_components.ha_lens")
          assert callable(module.async_setup_entry)
          assert callable(module.async_unload_entry)
          assert module.HaLensViewerView.cors_allowed is True
          assert module.HaLensViewerView.requires_auth is False
          assert module.HaLensViewerView.url == "/ha_lens_viewer/{path:.*}"

          view_source = inspect.getsource(importlib.import_module("homeassistant.helpers.http").HomeAssistantView.register)
          assert "KEY_ALLOW_ALL_CORS" in view_source, "cors_allowed no longer maps to wildcard CORS"

          source = pathlib.Path("custom_components/ha_lens/__init__.py").read_text()
          forbidden = (
              "DATA_COMPONENT",
              "ha_lens/automations",
              "websocket_api.async_register_command",
          )
          for token in forbidden:
              assert token not in source, f"Private/custom HA API dependency returned: {token}"

          contracts = {
              "homeassistant.components.automation": ("automation/config",),
              "homeassistant.components.search": ("search/related",),
              "homeassistant.components.trace.websocket_api": ("trace/list", "trace/get"),
              "homeassistant.components.websocket_api.commands": (
                  "trigger_platforms/subscribe",
                  "condition_platforms/subscribe",
              ),
              "homeassistant.components.config.floor_registry": ("config/floor_registry/list",),
              "homeassistant.components.config.label_registry": ("config/label_registry/list",),
          }
          for module_name, tokens in contracts.items():
              contract_source = inspect.getsource(importlib.import_module(module_name))
              for token in tokens:
                  assert token in contract_source, f"Home Assistant contract missing: {token} ({module_name})"

          cv_source = inspect.getsource(importlib.import_module("homeassistant.helpers.config_validation"))
          for schema_name in ("TRIGGER_BASE_SCHEMA", "CONDITION_BASE_SCHEMA", "SCRIPT_ACTION_BASE_SCHEMA"):
              schema_index = cv_source.find(schema_name)
              assert schema_index >= 0, f"Home Assistant config schema missing: {schema_name}"
              schema_block = cv_source[schema_index:schema_index + 1800]
              assert "CONF_ENABLED" in schema_block, f"enabled field missing from {schema_name}"
              assert "Any(boolean, template)" in schema_block, f"enabled no longer accepts boolean-or-template in {schema_name}"

          print("HA Lens imports, WebSocket contracts, and enabled boolean/template semantics are available.")
          PY
      - name: Verify Home Assistant 2026.10.1 trace-without-ID contract
        if: matrix.home_assistant == '2026.10.1'
        run: |
          python - <<'PY'
          import importlib
          import inspect

          trace_module = importlib.import_module("homeassistant.components.automation.trace")
          trace_source = inspect.getsource(trace_module.trace_automation)
          assert "not_triggered: bool = False" in trace_source
          assert "if automation_id:" in trace_source
          assert "async_store_trace" in trace_source

          cv_source = inspect.getsource(importlib.import_module("homeassistant.helpers.config_validation").STATE_CONDITION_SCHEMA)
          assert "Cannot use 'for' with an attribute" in cv_source
          assert "Cannot use 'for' with a list of states" in cv_source
          assert "Cannot use 'for' with a state referencing an entity" in cv_source

          print("HA 2026.10.1 trace-ID storage and stricter state-duration validation contracts are present.")
          PY
