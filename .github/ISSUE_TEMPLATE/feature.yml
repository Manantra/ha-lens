name: Feature request
description: Suggest a visualization, analyzer, export, or Home Assistant syntax improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should HA Lens make easier to understand?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example automation or workflow
      description: Please remove secrets and private data.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
